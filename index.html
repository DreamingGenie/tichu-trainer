<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>티츄 배우기 — 읽지 말고 해보면서</title>
  <meta name="description" content="보드게임 티츄의 규칙을 설명하고, 상황별로 무엇이 최선인지 직접 풀어보며 익히는 연습 사이트.">
  <!-- 첫 페인트 전에 테마를 정한다. 이게 있어야 tokens.css 가 팔레트를 두 벌만 갖고,
       새로고침할 때 밝은 화면이 번쩍이지 않는다. -->
  <script>
    (function () {
      var theme = 'light';
      try {
        theme = localStorage.getItem('tichu-trainer:theme')
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) { /* 저장소를 못 읽으면 라이트로 */ }
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <!-- 본문 서체. 웹폰트가 안 뜨면 tokens.css 의 폴백(system-ui)으로 떨어지고 화면은 그대로 선다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">

  <!-- 화면을 가리지 않고 쓰이는 부품 -->
  <link rel="stylesheet" href="styles/components/card.css">
  <link rel="stylesheet" href="styles/components/control.css">
  <link rel="stylesheet" href="styles/components/surface.css">
  <link rel="stylesheet" href="styles/components/table.css">

  <!-- 화면별 스타일 -->
  <link rel="stylesheet" href="styles/pages/home.css">
  <link rel="stylesheet" href="styles/pages/lesson.css">
  <link rel="stylesheet" href="styles/pages/quiz.css">
  <link rel="stylesheet" href="styles/pages/minigame.css">
  <link rel="stylesheet" href="styles/pages/sandbox.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f7a58'/><circle cx='50' cy='50' r='30' fill='none' stroke='white' stroke-width='14'/></svg>">
</head>
<body>
  <div class="app">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="#/">
          <span class="brand__mark" aria-hidden="true">티</span>
          <span class="brand__text">티츄 배우기</span>
        </a>
        <span class="spacer"></span>
        <a class="btn btn--small btn--ghost" href="#/sandbox">샌드박스</a>
        <a class="btn btn--small btn--ghost" href="#/minigame">미니판</a>
        <button class="btn btn--small btn--ghost" id="theme-toggle" type="button">다크</button>
      </div>
    </header>

    <main class="main" id="app"></main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        규칙은 Fata Morgana / Rio Grande의 공식 룰북을 기준으로 정리했습니다.
        숫자카드는 이 사이트에서 그린 것이고, 특수카드 4장의 삽화는 이 사이트를 위해 따로 만든
        것입니다. 어느 쪽도 실제 티츄 카드의 디자인은 아닙니다.
      </div>
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
